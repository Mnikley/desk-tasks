[project]
name = "desk-tasks"
version = "0.2.0"
description = "Nextcloud Tasks as a Windows desktop widget: pinned, keyboard-first, two-way CalDAV sync"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Matthias Ley" }]
requires-python = ">=3.11"
keywords = ["nextcloud", "caldav", "tasks", "todo", "windows", "desktop-widget"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  # pywebview brings pythonnet (WebView2 on Windows) and its GTK/Qt backends elsewhere.
  "pywebview>=6.2.1,<6.3",
  "keyring>=25.7",
  "pystray>=0.19.5",
  "pillow>=11",
  # WinRT toasts directly: windows-toasts pins winrt 3.x, which has no Python 3.15 wheels.
  "winrt-runtime>=4.0.3,<5; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications>=4!10.0.28000.2705; sys_platform == 'win32'",
  "winrt-Windows.Data.Xml.Dom>=4!10.0.28000.2705; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Mnikley/desk-tasks"
Issues = "https://github.com/Mnikley/desk-tasks/issues"
Changelog = "https://github.com/Mnikley/desk-tasks/blob/main/CHANGELOG.md"

[project.gui-scripts]
desk-tasks = "desk_tasks.__main__:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.14", "ty>=0.0.93"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk_tasks"]
# The web bundle is built (bun run build) and gitignored; the wheel must still carry it.
artifacts = ["src/desk_tasks/web/**"]

[tool.hatch.build.targets.sdist]
# uv build makes the wheel from the sdist, so the bundle has to be in the sdist too.
artifacts = ["src/desk_tasks/web/**"]
include = ["src/desk_tasks", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Build scripts: they run uv, the installer and the built app on purpose.
"packaging/**" = ["S603", "S607"]
# Windows-only modules assert the platform before their imports (so ty checks them as Windows).
"src/desk_tasks/win/{api,desktop,shell}.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.src]
include = ["src"]
