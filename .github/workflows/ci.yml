name: CI

on:
  push:
    branches: ["**"]
    # v1.2.3 publishes release 1.2.3 (the release job, at the end).
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a running check, but never a run on main or a tag mid-publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Lint, types and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: bun install --frozen-lockfile
      - name: Biome, tsc, bun test, ruff, ty, pytest
        run: bun run check
      - name: Chromium for the UI tests
        run: bunx playwright-core install --with-deps chromium
      - name: UI tests (built bundle, stub bridge)
        run: bun run test:ui

  nextcloud:
    name: Against a real Nextcloud (Docker)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:nextcloud

  python-min:
    name: Python 3.11 (the oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv run --python 3.11 pytest -q -rs

  windows:
    name: Windows smoke (Python 3.15)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.15
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: pytest (includes tests/test_windows.py)
        run: |
          uv run --python 3.15 python -VV
          uv run --python 3.15 pytest -q -rs

  wheel:
    name: Wheel
    needs: [checks, python-min, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: bun install --frozen-lockfile
      - name: Build the bundle and the wheel, check its contents
        run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  installer:
    name: Installer (build, install, update over a running app, uninstall)
    needs: wheel
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Git Bash would turn /VERYSILENT into a path.
      MSYS_NO_PATHCONV: "1"
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
      INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
      # Optional code signing: a base64 PFX and its password as repository secrets.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.15
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Inno Setup 6.7.4 (pinned, checksum checked)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o innosetup.exe "$INNO_URL"
          echo "$INNO_SHA256  innosetup.exe" | sha256sum -c -
          ./innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER "/DIR=$RUNNER_TEMP\inno"
          test -f "$RUNNER_TEMP\inno\ISCC.exe"
          echo "ISCC=$RUNNER_TEMP\inno\ISCC.exe" >> "$GITHUB_ENV"
      - name: Signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "DESK_TASKS_SIGN=`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p $env:WINDOWS_CERTIFICATE_PASSWORD `$f" >> $env:GITHUB_ENV
      - name: Build dist/desk-tasks-setup.exe
        run: uv run --python 3.15 python packaging/windows/build.py --wheel dist/desk_tasks-*.whl
      - name: Install, update over a running desk-tasks, uninstall
        run: |
          version=$(uv run --python 3.15 python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          uv run --python 3.15 python packaging/windows/smoke.py dist/desk-tasks-setup.exe "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/desk-tasks-setup.exe

  publish:
    name: Publish the development build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [wheel, installer, nextcloud]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update the "latest-build" pre-release in place
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on main, for testing. Releases are the tagged versions; the app's updates come from those only."
          if gh release view latest-build >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest-build dist/* --clobber
            gh release edit latest-build --title "Development build" --notes "$notes" --prerelease --latest=false
          else
            gh release create latest-build dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Development build" --notes "$notes"
          fi

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [wheel, installer, nextcloud]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The tag, the version and the changelog agree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::tag $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
          awk -v v="## $version" '$0 ~ "^## " { if (on) exit; on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          {
            echo
            echo "**Install:** download \`desk-tasks-setup.exe\` below and run it (no administrator rights needed)."
            echo "Already installed? desk-tasks offers the update itself."
            echo
            echo "[Code signing policy](https://github.com/Mnikley/desk-tasks#code-signing-policy) · [Privacy policy](https://github.com/Mnikley/desk-tasks/blob/main/PRIVACY.md)"
            echo
            echo "SHA-256: \`$(sha256sum dist/desk-tasks-setup.exe | cut -d' ' -f1)\` (desk-tasks-setup.exe)"
          } >> notes.md
          cat notes.md
      - name: Create the release (marked latest; the app's update check reads it)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
            --title "desk-tasks ${GITHUB_REF_NAME#v}" --notes-file notes.md

  install-check:
    name: Install the release as the README says (Windows)
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: "1"
    steps:
      - uses: actions/checkout@v4
      - name: The README's installer link, downloaded and installed silently
        run: |
          url=$(grep -m1 -o 'https://github.com/[^ )]*releases/latest/download/desk-tasks-setup\.exe' README.md)
          echo "$url"
          curl -fsSL -o "$RUNNER_TEMP/desk-tasks-setup.exe" "$url"
          "$RUNNER_TEMP/desk-tasks-setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          "$LOCALAPPDATA/Programs/desk-tasks/app-${GITHUB_REF_NAME#v}/python.exe" -c "import desk_tasks.win.shell, webview, winrt.windows.ui.notifications; import desk_tasks; print('desk-tasks', desk_tasks.__version__)"
      # A system Python, as a python.org install is (the README says only-system).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v6
      - name: The README's uv command, verbatim
        run: |
          cmd=$(grep -m1 -o 'uv tool install .*releases/latest/download/[^ ]*\.whl' README.md)
          echo "$cmd"
          eval "$cmd"
          py="$(uv tool dir)/desk-tasks/Scripts/python.exe"
          "$py" -c "import desk_tasks.win.shell, webview, winrt.windows.ui.notifications; import desk_tasks; print('desk-tasks', desk_tasks.__version__)"
