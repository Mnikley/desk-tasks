name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a running check, but never a run on main mid-publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, types and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: bun install --frozen-lockfile
      - name: Biome, tsc, bun test, ruff, ty, pytest
        run: bun run check
      - name: Chromium for the UI tests
        run: bunx playwright-core install --with-deps chromium
      - name: UI tests (built bundle, stub bridge)
        run: bun run test:ui

  nextcloud:
    name: Against a real Nextcloud (Docker)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:nextcloud

  python-min:
    name: Python 3.11 (the oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv run --python 3.11 pytest -q -rs

  windows:
    name: Windows smoke (Python 3.15)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.15
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: pytest (includes tests/test_windows.py)
        run: |
          uv run --python 3.15 python -VV
          uv run --python 3.15 pytest -q -rs

  wheel:
    name: Wheel
    needs: [checks, python-min, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: bun install --frozen-lockfile
      - name: Build the bundle and the wheel, check its contents
        run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  publish:
    name: Publish the latest build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [wheel, nextcloud]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Update the "latest-build" release in place (the install URL never 404s)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on main. Install or update on Windows: see the README."
          if gh release view latest-build >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest-build dist/*.whl --clobber
            gh release edit latest-build --notes "$notes" --latest
          else
            gh release create latest-build dist/*.whl --target "$GITHUB_SHA" --latest \
              --title "Latest build" --notes "$notes"
          fi

  install-check:
    name: Install the published build as the README says (Windows)
    needs: publish
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # A system Python, as a python.org install is (the README says only-system).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v6
      - name: The README's install command, verbatim
        run: |
          cmd=$(grep -m1 -o 'uv tool install .*releases/latest/download/[^ ]*\.whl' README.md)
          echo "$cmd"
          eval "$cmd"
      - name: The installed app imports its Windows shell
        run: |
          py="$(uv tool dir)/desk-tasks/Scripts/python.exe"
          "$py" -c "import desk_tasks.win.shell, webview, winrt.windows.ui.notifications; import desk_tasks; print('desk-tasks', desk_tasks.__version__)"
